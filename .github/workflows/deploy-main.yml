name: Deploy to Production (asitb.et)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Production Environment
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
      SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      TARGET_DIR: ${{ secrets.CPANEL_PROD_DIR || 'asitb.et' }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_pgsql, pgsql, intl, zip
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: |
          composer config --global policy.advisories.block false
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install

      - name: 🔨 Build Frontend Assets
        run: npm run build

      - name: 🔑 Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '#!/bin/sh\necho "$SSH_PASSPHRASE"\n' > ~/.ssh/askpass.sh
          chmod +x ~/.ssh/askpass.sh
          DISPLAY=None SSH_ASKPASS=~/.ssh/askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key < /dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 🚀 Sync Laravel App to cPanel (asitb.et)
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'src' \
            --exclude 'dist' \
            --exclude 'tests' \
            --exclude '.env' \
            --exclude 'public/storage' \
            --exclude 'public/hot' \
            --exclude 'storage/logs/*' \
            --exclude 'storage/framework/cache/data/*' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/views/*' \
            -e "ssh -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$TARGET_DIR/"

      - name: 🗄️ Provision .env & Run Migrations
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cat > /tmp/remote.sh <<EOF
          set -e
          cd "$TARGET_DIR"
          if [ ! -f .env ]; then
            cat > .env <<ENV
          APP_NAME="Afar SITB Web Portal"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_TIMEZONE=Africa/Addis_Ababa
          APP_URL=https://asitb.et

          LOG_CHANNEL=daily
          LOG_LEVEL=error

          DB_CONNECTION=pgsql
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_DATABASE=$DB_DATABASE
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD

          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          ENV
            php artisan key:generate --force
          fi
          php artisan storage:link || true
          php artisan migrate --force
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          EOF
          for attempt in 1 2 3 4 5; do
            echo "SSH provisioning attempt $attempt..."
            if ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s < /tmp/remote.sh; then
              echo "Provisioning succeeded."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 45s..."
            sleep 45
          done
          echo "All SSH attempts failed."
          exit 1
