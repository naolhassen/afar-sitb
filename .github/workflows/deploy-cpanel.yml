name: Build and deploy to cPanel

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader --no-scripts

      - name: Install JS dependencies and build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Prepare deploy zip
        # Excludes files/folders that are environment-specific or already on the server.
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "storage/*" \
            -x "bootstrap/cache/*" \
            -x ".env" \
            -x ".env.*" \
            -x "tests/*" \
            -x "phpunit.xml*" \
            -x ".devin/*" \
            -x ".windsurf/*"

      - name: Upload deploy zip to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          source: "deploy.zip"
          target: "/home/${{ secrets.CPANEL_USER }}/"

      - name: Extract and finish on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          script: |
            set -e
            cd /home/${{ secrets.CPANEL_USER }}/${{ secrets.CPANEL_APP_DIR }}
            unzip -o -q /home/${{ secrets.CPANEL_USER }}/deploy.zip
            php -v
            php artisan optimize
