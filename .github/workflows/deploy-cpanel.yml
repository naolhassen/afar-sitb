name: Build and deploy to cPanel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --optimize-autoloader --no-scripts

      - name: Install JS dependencies and build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Prepare deploy zip
        # Excludes files/folders that are environment-specific or already on the server.
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "storage/*" \
            -x "bootstrap/cache/*" \
            -x ".env" \
            -x ".env.*" \
            -x "tests/*" \
            -x "phpunit.xml*" \
            -x ".devin/*" \
            -x ".windsurf/*"

      - name: Upload deploy zip to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          source: "deploy.zip"
          target: "/home/${{ secrets.CPANEL_USER }}/"

      - name: Extract and finish on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          port: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          script: |
            set -e
            cd /home/${{ secrets.CPANEL_USER }}/${{ secrets.CPANEL_APP_DIR }}
            unzip -o -q /home/${{ secrets.CPANEL_USER }}/deploy.zip

            # Use the PHP binary configured in CPANEL_PHP secret, or try common PHP 8.2 CLI paths.
            PHP_BIN="${{ secrets.CPANEL_PHP }}"
            if [ -z "$PHP_BIN" ]; then
              for c in php82 php8.2 /opt/cpanel/ea-php82/root/usr/bin/php /opt/alt/php82/usr/bin/php /usr/local/bin/php82 /usr/bin/php82; do
                if command -v "$c" >/dev/null 2>&1; then
                  PHP_BIN="$c"
                  break
                fi
              done
            fi
            [ -z "$PHP_BIN" ] && PHP_BIN="php"

            echo "Using PHP binary: $PHP_BIN"
            $PHP_BIN -v
            $PHP_BIN artisan optimize
