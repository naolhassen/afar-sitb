version: '3.9'

services:
  db:
    image: postgres:15
    container_name: asitb_db
    environment:
      POSTGRES_DB: asitb
      POSTGRES_USER: asitb
      POSTGRES_PASSWORD: asitb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asitb"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: asitb_app
    ports:
      - "8000"
    environment:
      APP_NAME: "Afar SITB"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      SESSION_DRIVER: file
      CACHE_STORE: file
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: asitb
      DB_USERNAME: asitb
      DB_PASSWORD: asitb
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public &&
             chmod -R 777 storage &&
             cp .env.example .env &&
             echo 'SESSION_DRIVER=file' >> .env &&
             echo 'CACHE_STORE=file' >> .env &&
             sed -i '/^DB_/d' .env &&
             echo 'DB_CONNECTION=pgsql' >> .env &&
             echo 'DB_HOST=db' >> .env &&
             echo 'DB_PORT=5432' >> .env &&
             echo 'DB_DATABASE=asitb' >> .env &&
             echo 'DB_USERNAME=asitb' >> .env &&
             echo 'DB_PASSWORD=asitb' >> .env &&
             php artisan key:generate --no-interaction &&
             php artisan config:clear &&
             php artisan migrate --no-interaction &&
             php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  pgdata:
